
{% extends "base.html" %}
{% block title %}{{ 'Editar usuario' if usuario else 'Nuevo usuario' }} | DevProject Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4">
                {{ 'Editar usuario' if usuario else 'Nuevo usuario' }}
            </h1>

            <form method="POST">
                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" name="nombre" class="form-control"
                           maxlength="100"
                           value="{{ usuario.nombre if usuario else '' }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" name="email" class="form-control"
                           maxlength="150"
                           value="{{ usuario.email if usuario else '' }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol</label>
                    <select name="rol" class="form-select" required>
                        {% for clave, nombre_rol in roles.items() %}
                        <option value="{{ clave }}"
                            {% if usuario and usuario.rol == clave %}selected
                            {% elif not usuario and clave == 'desarrollador' %}selected
                            {% endif %}>
                            {{ nombre_rol }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Contraseña
                        {% if usuario %}(opcional; dejar vacía para conservarla){% endif %}
                    </label>
                    <input type="password" name="password" class="form-control"
                           minlength="10" autocomplete="new-password"
                           {% if not usuario %}required{% endif %}>
                    <div class="form-text">
                        Mínimo 10 caracteres, mayúscula, minúscula, número y símbolo.
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Estado de la cuenta</label>
                    <select name="activo" class="form-select">
                        <option value="1"
                            {% if not usuario or usuario.activo %}selected{% endif %}>
                            Activo
                        </option>
                        <option value="0"
                            {% if usuario and not usuario.activo %}selected{% endif %}>
                            Inactivo
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary">Guardar</button>
                    <a href="{{ url_for('usuarios') }}"
                       class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
