
{% extends "base.html" %}
{% block title %}Recuperar contraseña | DevProject Manager{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card shadow-sm p-4">
        <h1 class="h3">Recuperar contraseña</h1>
        <p class="text-secondary">
            Escribe el correo de tu cuenta para solicitar un enlace de recuperación.
        </p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control"
                       maxlength="150" required>
            </div>
            <button class="btn btn-primary w-100">Solicitar recuperación</button>
        </form>

        <a class="text-center mt-3" href="{{ url_for('login') }}">
            Volver al inicio de sesión
        </a>
    </div>
</div>
{% endblock %}
